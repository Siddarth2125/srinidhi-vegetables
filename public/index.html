<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srinidhi Vegetables</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; margin: 0; padding-bottom: 100px; }
        header { background: white; padding: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-content { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        
        /* 🔥 NEW LOGO STYLING (No Broccoli) */
        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 24px; color: #1e392a; font-weight: 900; letter-spacing: -0.5px; margin: 0; }
        .brand-logo img { height: 50px; width: 50px; object-fit: cover; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        
        .auth-btn { background: #2c3e50; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .cat-btn { background: #eef2f3; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; white-space: nowrap; font-weight: 600; color: #555; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background: #27ae60; color: white; border-color: #27ae60; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: white; border-radius: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; display: flex; flex-direction: column; justify-content: space-between; height: 300px; position: relative; }
        .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background-color: #f0f0f0; }
        .name { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 4px; height: 40px; overflow: hidden; line-height: 1.3; }
        .unit { font-size: 12px; color: #777; font-weight: 500; margin-bottom: 4px; }
        .price { color: #27ae60; font-size: 17px; font-weight: 800; margin-bottom: 10px; }
        .add-btn { background: white; color: #27ae60; border: 2px solid #27ae60; padding: 6px; width: 100%; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; text-transform: uppercase; }
        .qty-control { display: flex; align-items: center; justify-content: space-between; border: 2px solid #27ae60; border-radius: 6px; overflow: hidden; }
        .qty-btn { background: #27ae60; color: white; border: none; padding: 6px 12px; font-weight: bold; cursor: pointer; font-size: 18px; width: 35px; }
        .qty-val { font-weight: 800; color: #27ae60; font-size: 14px; }
        .out-stock-card { opacity: 0.6; pointer-events: none; }
        .out-stock-card img { filter: grayscale(100%); }
        .badge { background: #e74c3c; color: white; padding: 4px 8px; font-size: 10px; border-radius: 4px; position: absolute; top: 10px; right: 10px; font-weight: bold; z-index: 10; }
        .cart-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background-color: #27ae60; color: white; padding: 12px 20px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 200; display: none; cursor: pointer; }
        .cart-total { font-weight: 800; font-size: 18px; }
        
        /* Modal & Checkout Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 300; display: none; align-items: center; justify-content: center; }
        .modal { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 85vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        .pay-tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .pay-tab { flex: 1; padding: 10px; text-align: center; border: 2px solid #ddd; border-radius: 8px; font-weight: bold; cursor: pointer; color: #777; transition: 0.2s; }
        .pay-tab.active { border-color: #27ae60; background: #e8f5e9; color: #27ae60; }
        
        .upi-box { text-align: center; padding: 15px; border: 1px solid #e0e0e0; border-radius: 10px; background: #fafafa; margin-bottom: 15px; }
        .qr-code { width: 150px; height: 150px; margin: 10px auto; border: 2px solid #27ae60; padding: 5px; border-radius: 8px; background: white; }
        .btn-link { display: inline-block; background: #5f259f; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .submit-order-btn { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="top-bar">
                <div class="brand-logo">
                    <!-- USING YOUR REAL LOGO -->
                    <img src="logo.jpg" alt="Srinidhi Vegetables">
                    Srinidhi Vegetables
                </div>
                <button class="auth-btn" id="auth-btn" onclick="openLoginModal()">Sign In</button>
            </div>
            <div class="cat-scroll">
                <button class="cat-btn active" onclick="filterCat('All')">All</button>
                <button class="cat-btn" onclick="filterCat('Vegetable')">Vegetables</button>
                <button class="cat-btn" onclick="filterCat('Leafy')">Leafy</button>
                <button class="cat-btn" onclick="filterCat('Fruit')">Fruits</button>
                <button class="cat-btn" onclick="filterCat('Premium')">Premium</button>
            </div>
            <input type="text" id="search" placeholder="🔍 Search specific item..." onkeyup="renderShop()">
        </div>
    </header>

    <div class="container">
        <div id="grid" class="grid"></div>
    </div>

    <div id="cart-bar" class="cart-bar" onclick="openCheckoutModal()">
        <div><span id="item-count">0</span> Items</div>
        <div class="cart-total">Checkout ₹<span id="total-price">0</span> ></div>
    </div>

    <!-- MANDATORY LOGIN MODAL -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal('login-modal')">&times;</span>
            <h2>Sign In / Register</h2>
            <p style="font-size: 14px; color: #e74c3c; font-weight:bold;">You must sign in before you can buy items.</p>
            <div class="form-group"><label>Email Address</label><input type="email" id="reg-email" placeholder="Enter your email"></div>
            <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" placeholder="Enter your name"></div>
            <div class="form-group"><label>Mobile Number (10 digits)</label><input type="tel" id="reg-phone" placeholder="Enter mobile number"></div>
            <div class="form-group"><label>Delivery Address</label><textarea id="reg-address" rows="3" placeholder="House No, Area, Landmark"></textarea></div>
            <button class="submit-order-btn" onclick="handleLogin()">Save & Continue</button>
        </div>
    </div>

    <!-- CHECKOUT & UPI MODAL -->
    <div id="checkout-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal('checkout-modal')">&times;</span>
            <h2 style="margin-top: 0;">Confirm Order 🛒</h2>
            
            <div style="background: #eef2f3; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid #ddd;">
                <strong style="color: #2c3e50;">Deliver To:</strong> <a href="#" onclick="closeModal('checkout-modal'); openLoginModal();" style="float: right; color: #2980b9; font-weight: bold; text-decoration: none;">Edit Details</a><br>
                <span id="confirm-name"></span><br>📞 <span id="confirm-phone"></span><br>🏠 <span id="confirm-address"></span>
            </div>
            
            <p style="font-size: 18px; margin-bottom: 15px;"><strong>Total Bill: ₹<span id="modal-total">0</span></strong></p>

            <label style="font-weight: bold; font-size: 14px; color: #444; display: block; margin-bottom: 8px;">Select Payment Method:</label>
            <div class="pay-tab-container">
                <div class="pay-tab active" id="tab-upi" onclick="switchPaymentMode('UPI')">📱 UPI Payment</div>
                <div class="pay-tab" id="tab-cod" onclick="switchPaymentMode('COD')">💵 Cash on Delivery</div>
            </div>

            <!-- UPI SECTION -->
            <div id="upi-section" class="upi-box">
                <p style="font-size: 13px; color: #555; margin-bottom: 10px;">Scan QR or click below to pay <strong>Srinidhi Vegetables</strong></p>
                <!-- Dynamic QR generates exact amount automatically -->
                <img id="dynamic-qr" class="qr-code" src="" alt="UPI QR Code">
                <br>
                <a id="dynamic-upi-link" href="#" class="btn-link">📱 Tap to Pay on Mobile App</a>
                
                <div class="form-group" style="margin-top: 10px;">
                    <label style="color: #e74c3c; font-weight: bold;">Enter 12-Digit UTR / Ref. Number: *</label>
                    <input type="number" id="utr-input" placeholder="e.g. 312345678901" required>
                </div>
            </div>

            <button id="final-submit-btn" class="submit-order-btn" onclick="submitFinalOrder()">Place Order</button>
        </div>
    </div>
    
    <script>
        // YOUR EXACT UPI ID:
        const MERCHANT_UPI_ID = "9963169733@ybl";
        const MERCHANT_NAME = "Srinidhi Vegetables";

        let products = [];
        let cart = {}; 
        let activeCat = 'All';
        let currentUser = JSON.parse(localStorage.getItem('srinidhiUser')) || null;
        let selectedPaymentMode = 'UPI';

        function checkAuthUI() {
            const authBtn = document.getElementById('auth-btn');
            authBtn.innerText = currentUser ? "👤 " + currentUser.name.split(" ")[0] : "Sign In";
        }

        function openLoginModal() {
            if (currentUser) {
                document.getElementById('reg-email').value = currentUser.email || '';
                document.getElementById('reg-name').value = currentUser.name || '';
                document.getElementById('reg-phone').value = currentUser.phone || '';
                document.getElementById('reg-address').value = currentUser.address || '';
            }
            document.getElementById('login-modal').style.display = 'flex';
        }

        async function handleLogin() {
            const email = document.getElementById('reg-email').value;
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const address = document.getElementById('reg-address').value;
            if(!email || !phone || !name || !address) { alert("Please fill all details!"); return; }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, name, address, email })
                });
                const data = await res.json();
                currentUser = { ...data.user, email, name, phone, address };
                localStorage.setItem('srinidhiUser', JSON.stringify(currentUser));
                checkAuthUI();
                closeModal('login-modal');
            } catch(e) { alert("Error signing in."); }
        }

        async function loadData() {
            checkAuthUI();
            try { 
                const res = await fetch('/api/vegetables'); 
                products = await res.json(); 
                products.sort((a, b) => a.name.localeCompare(b.name));
                renderShop(); 
            } catch (err) { console.error(err); }
        }

        function filterCat(category) {
            activeCat = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText === category || (category === 'All' && btn.innerText === 'All')) btn.classList.add('active');
            });
            renderShop();
        }

        function renderShop() {
            const grid = document.getElementById('grid');
            const term = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = "";

            products.forEach(item => {
                if(!item.name.toLowerCase().includes(term)) return;
                if (activeCat !== 'All' && (!item.category || item.category !== activeCat)) return; 

                let imageSrc = item.imageUrl || `https://placehold.co/400x300/e8f5e9/1b5e20.png?text=${encodeURIComponent(item.name)}`;
                let imageHTML = `<img src="${imageSrc}" alt="${item.name}">`;

                const cartItem = cart[item.name]; 
                const step = item.unit.toLowerCase() === 'kg' ? 0.25 : 1;
                
                // MANDATORY LOGIN BLOCKER
                let buttonHTML = !item.inStock ? `<div style="font-size:12px; color:red; font-weight:bold;">Out of Stock</div>` 
                    : cartItem ? `<div class="qty-control"><button class="qty-btn" onclick="updateQty('${item.name}', -${step})">-</button><span class="qty-val">${cartItem.qty} ${item.unit}</span><button class="qty-btn" onclick="updateQty('${item.name}', ${step})">+</button></div>`
                    : `<button class="add-btn" onclick="addToCart('${item.name}', ${item.price}, '${item.unit}', ${step})">ADD +</button>`;

                grid.innerHTML += `<div class="card ${!item.inStock ? 'out-stock-card' : ''}">${!item.inStock ? '<span class="badge">Sold Out</span>' : ''}${imageHTML}<div class="name">${item.name}</div><div class="unit">Price: ₹${item.price} / ${item.unit}</div>${buttonHTML}</div>`;
            });
            updateCartBar();
        }

        function addToCart(name, price, unit, step) {
            // ENFORCE LOGIN
            if(!currentUser) {
                alert("You must sign in to start buying vegetables!");
                openLoginModal();
                return;
            }
            cart[name] = { price, unit, qty: step };
            renderShop();
        }

        function updateQty(name, change) {
            let newQty = Math.round((cart[name].qty + change) * 100) / 100;
            if (newQty <= 0) delete cart[name]; else cart[name].qty = newQty;
            renderShop();
        }

        function updateCartBar() {
            let totalItems = 0, totalPrice = 0;
            for(let name in cart) { totalItems++; totalPrice += cart[name].qty * cart[name].price; }
            document.getElementById('item-count').innerText = totalItems;
            document.getElementById('total-price').innerText = Math.round(totalPrice);
            document.getElementById('modal-total').innerText = Math.round(totalPrice);
            document.getElementById('cart-bar').style.display = totalItems > 0 ? "flex" : "none";
        }

        function openCheckoutModal() {
            document.getElementById('confirm-name').innerText = currentUser.name || '';
            document.getElementById('confirm-phone').innerText = currentUser.phone || '';
            document.getElementById('confirm-address').innerText = currentUser.address || '';
            
            // Generate exact UPI link for the specific total amount
            const total = document.getElementById('modal-total').innerText;
            const upiString = `upi://pay?pa=${MERCHANT_UPI_ID}&pn=${encodeURIComponent(MERCHANT_NAME)}&cu=INR&am=${total}`;
            
            // Set dynamic QR code and Button Link
            document.getElementById('dynamic-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
            document.getElementById('dynamic-upi-link').href = upiString;

            switchPaymentMode('UPI'); // Default to UPI
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function switchPaymentMode(mode) {
            selectedPaymentMode = mode;
            if(mode === 'UPI') {
                document.getElementById('tab-upi').classList.add('active');
                document.getElementById('tab-cod').classList.remove('active');
                document.getElementById('upi-section').style.display = 'block';
                document.getElementById('final-submit-btn').innerText = "Submit UPI UTR & Place Order";
            } else {
                document.getElementById('tab-cod').classList.add('active');
                document.getElementById('tab-upi').classList.remove('active');
                document.getElementById('upi-section').style.display = 'none';
                document.getElementById('final-submit-btn').innerText = "Place COD Order";
            }
        }

        async function submitFinalOrder() {
            let utrNumber = "N/A";
            
            // Ensure UTR is provided if UPI is selected
            if(selectedPaymentMode === 'UPI') {
                utrNumber = document.getElementById('utr-input').value.trim();
                if(utrNumber.length < 12) {
                    alert("⚠️ Please enter the complete 12-digit UTR / Reference number from your payment app.");
                    return;
                }
            }

            document.getElementById('final-submit-btn').innerText = "Processing Order...";
            document.getElementById('final-submit-btn').disabled = true;

            const itemsArray = Object.keys(cart).map(name => {
                return { name: name, qty: cart[name].qty, unit: cart[name].unit, price: cart[name].price };
            });

            const orderData = {
                customerName: currentUser.name, customerPhone: currentUser.phone, customerAddress: currentUser.address,
                items: itemsArray, totalAmount: parseInt(document.getElementById('modal-total').innerText),
                paymentMode: selectedPaymentMode, transactionId: utrNumber
            };

            try {
                const res = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderData) });
                if(res.ok) {
                    cart = {}; 
                    alert("✅ Order Placed Successfully! We will verify your payment and process it shortly.");
                    location.reload(); 
                }
            } catch(e) { 
                alert("Error placing order."); 
                document.getElementById('final-submit-btn').innerText = "Place Order";
                document.getElementById('final-submit-btn').disabled = false;
            }
        }

        loadData();
    </script>
</body>
</html>
