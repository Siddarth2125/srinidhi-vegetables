<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srinidhi Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
        h1 { color: #2c3e50; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; }
        img.preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; }
        .modal { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-save { width: 100%; background: #2980b9; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .close-btn { color: red; float: right; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h1>⚙️ Store Inventory</h1>
            <button class="btn-add" onclick="openAddModal()">➕ Add New Vegetable</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Unit</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="inventory-list">
                <tr><td colspan="6">Loading inventory...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" onclick="closeModal()">✖ Cancel</span>
            <h2>Add New Item</h2>
            <form id="addForm" onsubmit="saveNewItem(event)">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="newName" placeholder="e.g., Dragon Fruit" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="newCategory">
                        <option value="Vegetable">Vegetable</option>
                        <option value="Leafy">Leafy</option>
                        <option value="Fruit">Fruit</option>
                        <option value="Premium">Premium</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="newPrice" placeholder="e.g., 150" required>
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    <select id="newUnit">
                        <option value="kg">per Kg</option>
                        <option value="each">Each / Piece</option>
                        <option value="bunch">per Bunch</option>
                        <option value="pack">per Pack</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Image URL (Optional)</label>
                    <input type="text" id="newImage" placeholder="Paste Amazon/Wiki image link here">
                </div>
                <button type="submit" class="btn-save">💾 Save to Store</button>
            </form>
        </div>
    </div>

    <script>
        // Load existing inventory
        async function loadInventory() {
            try {
                const res = await fetch('/api/vegetables');
                const products = await res.json();
                const tbody = document.getElementById('inventory-list');
                tbody.innerHTML = '';

                products.forEach(item => {
                    let safeImg = item.imageUrl || `https://placehold.co/100x100/e8f5e9/1b5e20.png?text=${encodeURIComponent(item.name)}`;
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${safeImg}" class="preview"></td>
                            <td style="font-weight:bold;">${item.name}</td>
                            <td>${item.category || 'Vegetable'}</td>
                            <td>₹${item.price}</td>
                            <td>${item.unit}</td>
                            <td><button class="btn-delete" onclick="deleteItem('${item._id}')">🗑️ Delete</button></td>
                        </tr>
                    `;
                });
            } catch (err) { alert("Error loading inventory"); }
        }

        // Modal Controls
        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; document.getElementById('addForm').reset(); }

        // Save a brand new item to database
        async function saveNewItem(event) {
            event.preventDefault(); // Stop page from refreshing
            
            const newItem = {
                name: document.getElementById('newName').value,
                category: document.getElementById('newCategory').value,
                price: document.getElementById('newPrice').value,
                unit: document.getElementById('newUnit').value,
                imageUrl: document.getElementById('newImage').value,
                inStock: true
            };

            try {
                const res = await fetch('/api/vegetables', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newItem)
                });

                if (res.ok) {
                    alert("🎉 Item Added Successfully!");
                    closeModal();
                    loadInventory(); // Refresh table instantly
                }
            } catch (err) { alert("Failed to add item."); }
        }

        // Delete an item
        async function deleteItem(id) {
            if (!confirm("Are you sure you want to delete this item forever?")) return;
            
            try {
                await fetch(`/api/vegetables/${id}`, { method: 'DELETE' });
                loadInventory(); // Refresh table instantly
            } catch (err) { alert("Failed to delete item."); }
        }

        loadInventory();
    </script>
</body>
</html>
