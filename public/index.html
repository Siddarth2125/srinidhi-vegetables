<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srinidhi Vegetables - E-Commerce</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; margin: 0; padding-bottom: 100px; }
        header { background: white; padding: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-content { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 22px; color: #2c3e50; font-weight: 800; }
        
        /* User Profile Button */
        .auth-btn { background: #2c3e50; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        .cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .cat-btn { background: #eef2f3; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; white-space: nowrap; font-weight: 600; color: #555; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background: #27ae60; color: white; border-color: #27ae60; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: white; border-radius: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; display: flex; flex-direction: column; justify-content: space-between; height: 300px; position: relative; }
        .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background-color: #f0f0f0; display: block; }
        .placeholder-box { width: 100%; height: 130px; background-color: #e8f5e9; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; color: #1b5e20; font-weight: 700; font-size: 18px; padding: 10px; box-sizing: border-box; display: none; }
        .placeholder-box.visible { display: flex; }
        .name { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 4px; height: 40px; overflow: hidden; line-height: 1.3; }
        .unit { font-size: 12px; color: #777; font-weight: 500; margin-bottom: 4px; }
        .price { color: #27ae60; font-size: 17px; font-weight: 800; margin-bottom: 10px; }

        .add-btn { background: white; color: #27ae60; border: 2px solid #27ae60; padding: 6px; width: 100%; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; text-transform: uppercase; }
        .qty-control { display: flex; align-items: center; justify-content: space-between; border: 2px solid #27ae60; border-radius: 6px; overflow: hidden; }
        .qty-btn { background: #27ae60; color: white; border: none; padding: 6px 12px; font-weight: bold; cursor: pointer; font-size: 18px; width: 35px; }
        .qty-val { font-weight: 800; color: #27ae60; font-size: 14px; }

        .out-stock-card { opacity: 0.6; pointer-events: none; }
        .out-stock-card img, .out-stock-card .placeholder-box { filter: grayscale(100%); }
        .badge { background: #e74c3c; color: white; padding: 4px 8px; font-size: 10px; border-radius: 4px; position: absolute; top: 10px; right: 10px; font-weight: bold; z-index: 10; }

        .cart-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background-color: #27ae60; color: white; padding: 12px 20px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 200; display: none; cursor: pointer; }
        .cart-total { font-weight: 800; font-size: 18px; }

        /* Floating Customer Care */
        .float-wa { position: fixed; bottom: 20px; left: 20px; background-color: #25D366; color: white; padding: 12px 18px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 200; display: flex; align-items: center; gap: 5px; font-size: 14px; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 300; display: none; align-items: center; justify-content: center; }
        .modal { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 85vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .pay-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; color: white; background: #27ae60; }
        .pay-btn.cod { background: #2c3e50; }

        /* Order History Styles */
        .order-card { border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 15px; background: #fdfdfd; }
        .order-status { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .status-Pending { background: #f39c12; color: white; }
        .status-Packed { background: #3498db; color: white; }
        .status-Delivered { background: #27ae60; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="top-bar">
                <h1><span id="header-emoji"></span> Srinidhi Vegetables</h1>
                <button class="auth-btn" id="auth-btn" onclick="openLoginModal()">Login</button>
            </div>
            <div class="cat-scroll">
                <button class="cat-btn active" onclick="filterCat('All')">All</button>

        </div>

    <div class="container">
        <div id="grid" class="grid"></div>

    <a href="https://wa.me/919963169733" class="float-wa" target="_blank">📞 Support</a>

    <div id="cart-bar" class="cart-bar" onclick="openCheckoutModal()">
        <div><span id="item-count">0</span> Items</div>
        <div class="cart-total">Place Order <span class="rupee-symbol"></span><span id="total-price">0</span> ></div>

    <div id="login-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal('login-modal')">&times;</span>

            <p style="font-size: 14px; color: #666;">Create an account to save your address and track orders.</p>
            <div class="form-group">
                <label>Mobile Number (10 digits)</label>

    <div id="checkout-modal" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal('checkout-modal')">&times;</span>
            <h2>Confirm Order 🛒</h2>
            <div style="background: #eef2f3; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;">
                <strong>Deliver To:</strong><br>
                <span id="confirm-name"></span> (<span id="confirm-phone"></span>)<br>
                <span id="confirm-address"></span><br>
                <a href="#" onclick="closeModal('checkout-modal'); openLoginModal();" style="color: #2980b9;">Change Address</a>
            </div>
            <p><strong>Total Bill: <span class="rupee-symbol"></span><span id="modal-total">0</span></strong></p>
            <button class="pay-btn" id="btn-upi" onclick="submitOrder('UPI')">⚡ Pay via UPI (GPay/PhonePe)</button>
            <button class="pay-btn cod" onclick="submitOrder('COD')">💵 Cash on Delivery</button>
        </div>
    </div>

    <div id="orders-modal" class="modal-overlay">
        <div class="modal" style="max-width: 500px;">
            <span class="close-modal" onclick="closeModal('orders-modal')">&times;</span>
            <h2>My Orders</h2>
            <button onclick="logout()" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; float: right; margin-top: -40px;">Logout</button>
            <div id="orders-list" style="margin-top: 20px;">Loading orders...</div>

        let currentUser = JSON.parse(localStorage.getItem('srinidhiUser')) || null;

            "watermelon": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Taiwan_2009_Tainan_City_Organic_Farm_Watermelon_FRD_7962.jpg/640px-Taiwan_2009_Tainan_City_Organic_Farm_Watermelon_FRD_7962.jpg",
            "normal banana": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Banana-Single.jpg/640px-Banana-Single.jpg",
            "apple": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Red_Apple.jpg/640px-Red_Apple.jpg",
            "pineapple": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Pineapple_and_cross_section.jpg/640px-Pineapple_and_cross_section.jpg",
            "broccoli": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Broccoli_and_cross_section_edit.jpg/640px-Broccoli_and_cross_section_edit.jpg",
            "zucchini": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Ars_Cucumber.jpg/640px-Ars_Cucumber.jpg",
            "lettuce iceberg": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Iceberg_lettuce_in_SB.jpg/640px-Iceberg_lettuce_in_SB.jpg",
            "mushroom": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Champignon_mushroom.jpg/640px-Champignon_mushroom.jpg"
        };

        // --- AUTH LOGIC ---
        function checkAuthUI() {
            const authBtn = document.getElementById('auth-btn');
            if (currentUser) {
                authBtn.innerText = "👤 My Orders";
                authBtn.onclick = openMyOrders;
            } else {
                authBtn.innerText = "Login";
                authBtn.onclick = openLoginModal;
            }
        }

        function openLoginModal() {
            if (currentUser) {
                document.getElementById('reg-phone').value = currentUser.phone;
                document.getElementById('reg-name').value = currentUser.name;
                document.getElementById('reg-address').value = currentUser.address;
            }
            document.getElementById('login-modal').style.display = 'flex';
        }

        async function handleLogin() {
            const phone = document.getElementById('reg-phone').value;
            const name = document.getElementById('reg-name').value;
            const address = document.getElementById('reg-address').value;
            if(!phone || !name || !address) { alert("Please fill all details!"); return; }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, name, address })
                });
                const data = await res.json();
                localStorage.setItem('srinidhiUser', JSON.stringify(data.user));
                currentUser = data.user;
                checkAuthUI();
                closeModal('login-modal');
                alert("Profile Saved!");
            } catch(e) { alert("Error saving profile"); }
        }

        function logout() {
            localStorage.removeItem('srinidhiUser');
            currentUser = null;
            checkAuthUI();
            closeModal('orders-modal');
        }

        // --- SHOP & CART LOGIC ---
        async function loadData() {
            checkAuthUI();
            try { 
                const res = await fetch('/api/vegetables'); 
                products = await res.json(); 
                products.sort((a, b) => a.name.localeCompare(b.name));
                renderShop(); 
            } catch (err) { console.error(err); }
        }

        function filterCat(category) {
            activeCat = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText === category || (category === 'All' && btn.innerText === 'All')) btn.classList.add('active');
            });
            renderShop();
        }

        function renderShop() {
            const grid = document.getElementById('grid');
            const term = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = "";

            products.forEach(item => {
                if(!item.name.toLowerCase().includes(term)) return;
                if (activeCat !== 'All' && (!item.category || item.category !== activeCat)) return; 

                let searchName = item.name.toLowerCase().trim();
                let imageSrc = "";
                if (item.imageUrl && item.imageUrl.trim() !== "") {
                    imageSrc = item.imageUrl;
                } else if (staticImages[searchName]) { 
                    imageSrc = staticImages[searchName];
                }

                let imageHTML = imageSrc 
                    ? `<img src="${imageSrc}" alt="${item.name}" onerror="this.style.display='none'; this.nextElementSibling.classList.add('visible');">
                       <div class="placeholder-box">${item.name}</div>` 
                    : `<div class="placeholder-box visible">${item.name}</div>`;

                const cartItem = cart[item.name]; 
                const step = item.unit.toLowerCase() === 'kg' ? 0.25 : 1;
                
                let buttonHTML = !item.inStock ? `<div style="font-size:12px; color:red; font-weight:bold;">Out of Stock</div>` 
                    : cartItem ? `<div class="qty-control"><button class="qty-btn" onclick="updateQty('${item.name}', -${step})">-</button><span class="qty-val">${cartItem.qty} ${item.unit}</span><button class="qty-btn" onclick="updateQty('${item.name}', ${step})">+</button></div>`
                    : `<button class="add-btn" onclick="addToCart('${item.name}', ${item.price}, '${item.unit}', ${step})">ADD +</button>`;

                grid.innerHTML += `<div class="card ${!item.inStock ? 'out-stock-card' : ''}">${!item.inStock ? '<span class="badge">Sold Out</span>' : ''}${imageHTML}<div class="name">${item.name}</div><div class="unit">Price: \u20B9${item.price} / ${item.unit}</div>${buttonHTML}</div>`;
            });
            updateCartBar();
        }

        function addToCart(name, price, unit, step) {
            cart[name] = { price, unit, qty: step };
            renderShop();
        }

        function updateQty(name, change) {
            let newQty = Math.round((cart[name].qty + change) * 100) / 100;
            if (newQty <= 0) delete cart[name]; else cart[name].qty = newQty;
            renderShop();
        }

        function updateCartBar() {
            let totalItems = 0, totalPrice = 0;
            for(let name in cart) { totalItems++; totalPrice += cart[name].qty * cart[name].price; }
            document.getElementById('item-count').innerText = totalItems;
            document.getElementById('total-price').innerText = Math.round(totalPrice);
            document.getElementById('modal-total').innerText = Math.round(totalPrice);
            document.getElementById('cart-bar').style.display = totalItems > 0 ? "flex" : "none";
        }

        function openCheckoutModal() {
            if(!currentUser) {
                openLoginModal();
                return;
            }
            document.getElementById('confirm-name').innerText = currentUser.name;
            document.getElementById('confirm-phone').innerText = currentUser.phone;
            document.getElementById('confirm-address').innerText = currentUser.address;
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- NEW BULLETPROOF ORDERING LOGIC ---
        async function submitOrder(mode) {
            let total = 0;
            const itemsArray = Object.keys(cart).map(name => {
                total += cart[name].qty * cart[name].price;
                return { name: name, qty: cart[name].qty, unit: cart[name].unit, price: cart[name].price };
            });

            const orderData = {
                customerName: currentUser.name,
                customerPhone: currentUser.phone,
                customerAddress: currentUser.address,
                items: itemsArray,
                totalAmount: Math.round(total),
                paymentMode: mode
            };

            try {
                if (mode === 'UPI') document.getElementById('btn-upi').innerText = "Processing...";

                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                
                if(res.ok) {
                    cart = {}; // Empty cart

                    if (mode === 'UPI') {
                        // Transform modal to a safe "Click to Pay" screen
                        const upiId = "9963169733@ybl"; 
                        const upiLink = `upi://pay?pa=${upiId}&pn=SrinidhiVegetables&am=${orderData.totalAmount}&tn=Order`;
                        
                        document.querySelector('#checkout-modal .modal').innerHTML = `
                            <h2 style="color:#27ae60; margin-top:0;">✅ Order Saved!</h2>
                            <p style="color:#555; font-size:15px;">Your order has been sent to Srinidhi Vegetables. Please complete your payment to finalize.</p>
                            <h3 style="text-align:center; font-size:24px; color:#2c3e50;">Total: \u20B9${orderData.totalAmount}</h3>
                            <a href="${upiLink}" style="display:block; background:#e67e22; color:white; padding:15px; text-align:center; text-decoration:none; border-radius:8px; font-size:16px; font-weight:bold; margin:20px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">👉 TAP TO PAY ON GPAY / PHONEPE</a>
                            <button onclick="location.reload()" style="width:100%; padding:12px; border:none; background:#eee; color:#333; border-radius:8px; font-weight:bold; cursor:pointer;">I have completed the payment (Close)</button>
                        `;
                    } else {
                        alert("✅ Order Placed Successfully! You can track it in 'My Orders'.");
                        location.reload(); 
                    }
                }
            } catch(e) { 
                alert("Error placing order. Please try again."); 
                if (mode === 'UPI') document.getElementById('btn-upi').innerText = "⚡ Pay via UPI (GPay/PhonePe)";
            }
        }

        async function openMyOrders() {
            document.getElementById('orders-modal').style.display = 'flex';
            const list = document.getElementById('orders-list');
            list.innerHTML = "Fetching your orders...";
            try {
                const res = await fetch(`/api/orders/my/${currentUser.phone}`);
                const orders = await res.json();
                
                if(orders.length === 0) { list.innerHTML = "<p>You haven't placed any orders yet.</p>"; return; }

                list.innerHTML = orders.map(o => `
                    <div class="order-card">
                        <div class="order-status status-${o.status}">${o.status}</div>
                        <div style="font-size:12px; color:#777;">Order Date: ${new Date(o.orderDate).toLocaleString()}</div>
                        <div style="margin: 10px 0; font-size:14px;">
                            ${o.items.map(i => `<div>${i.name} - ${i.qty} ${i.unit}</div>`).join('')}
                        </div>
                        <div style="font-weight:bold; color:#27ae60;">Total: \u20B9${o.totalAmount} (${o.paymentMode})</div>
                    </div>
                `).join('');
            } catch(e) { list.innerHTML = "Failed to load orders."; }
        }

        loadData();
    </script>
</body>
</html>
