<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Srinidhi Retail</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: #2c3e50; color: white; display: flex; flex-direction: column; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; }
        .sidebar h2 { padding: 20px; margin: 0; font-size: 20px; border-bottom: 1px solid #34495e; color: #fff; display: flex; align-items: center; gap: 10px; }
        .nav-btn { padding: 18px 20px; background: none; border: none; color: #bdc3c7; text-align: left; font-size: 16px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .nav-btn:hover { background: #34495e; color: white; }
        .nav-btn.active { color: #2ecc71; border-left: 5px solid #2ecc71; background: #34495e; font-weight: bold; }
        
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-bar h1 { margin: 0; color: #2c3e50; font-size: 28px; }
        .btn-store { background: white; border: 1px solid #ccc; padding: 8px 15px; border-radius: 20px; text-decoration: none; color: #333; font-weight: bold; font-size: 14px; }
        .btn-store:hover { background: #eee; }
        
        .section { display: none; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .section.active { display: block; }
        
        /* Dashboard Stats Cards */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-card { padding: 25px; border-radius: 10px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 16px; opacity: 0.9; }
        .stat-card h2 { margin: 0; font-size: 32px; }

        /* Inventory Table */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 15px 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #555; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .img-preview { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .btn-add:hover { background: #219150; }
        .btn-del { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* Orders */
        .order-card { border: 1px solid #eee; padding: 20px; border-radius: 10px; margin-bottom: 15px; background: #fafafa; }
        .status-select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold; cursor: pointer; }

        /* Pop-up Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-save { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
        .close-btn { float: right; cursor: pointer; color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🥦 Srinidhi Retail</h2>
        <button class="nav-btn active" onclick="switchTab('dashboard-sec', this)">📊 Live Dashboard</button>
        <button class="nav-btn" onclick="switchTab('orders-sec', this)">📦 All Orders</button>
        <button class="nav-btn" onclick="switchTab('inventory-sec', this)">🍎 Manage Inventory</button>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <h1 id="page-title">Live Dashboard</h1>
            <a href="/" class="btn-store">View Storefront ↗</a>
        </div>

        <div id="dashboard-sec" class="section active">
            <div class="stat-grid">
                <div class="stat-card" style="background: linear-gradient(135deg, #3498db, #2980b9);">
                    <h3>Total Orders</h3>
                    <h2 id="dash-orders">0</h2>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #2ecc71, #27ae60);">
                    <h3>Total Revenue</h3>
                    <h2 id="dash-revenue">₹0</h2>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #e67e22, #d35400);">
                    <h3>Total Products</h3>
                    <h2 id="dash-products">0</h2>
                </div>
            </div>
            <p style="margin-top: 20px; color: #777;">Welcome to your admin control panel. Use the sidebar to manage your store.</p>
        </div>

        <div id="orders-sec" class="section">
            <div id="orders-list">Loading orders...</div>
        </div>

        <div id="inventory-sec" class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <input type="text" id="search-inv" placeholder="🔍 Search specific vegetable or fruit..." onkeyup="renderInventory()" style="padding: 12px; width: 350px; border-radius: 6px; border: 1px solid #ddd;">
                <button class="btn-add" onclick="openModal()">➕ Add New Vegetable</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price (₹)</th>
                        <th>Unit Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="inv-tbody">
                    <tr><td colspan="6">Loading inventory...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" onclick="closeModal()">✖ Cancel</span>
            <h2 style="margin-top: 0; color: #2c3e50;">Add New Item</h2>
            <form onsubmit="saveNewItem(event)">
                <div class="form-group"><label>Product Name</label><input type="text" id="newName" placeholder="e.g., Dragon Fruit" required></div>
                <div class="form-group"><label>Category</label><select id="newCat"><option>Vegetable</option><option>Leafy</option><option>Fruit</option><option>Premium</option></select></div>
                <div class="form-group"><label>Price (₹)</label><input type="number" id="newPrice" placeholder="e.g., 150" required></div>
                <div class="form-group"><label>Unit Type</label><select id="newUnit"><option>kg</option><option>each</option><option>bunch</option><option>pack</option></select></div>
                <div class="form-group"><label>Image URL (Optional)</label><input type="text" id="newImg" placeholder="Paste image link here"></div>
                <button type="submit" class="btn-save">💾 Save to Store</button>
            </form>
        </div>
    </div>

    <script>
        let inventory = [];

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            document.getElementById('page-title').innerText = btn.innerText.replace(/[^\w\s]/gi, '').trim();
        }

        async function loadOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                const orders = await res.json();
                
                // Update Dashboard Stats!
                document.getElementById('dash-orders').innerText = orders.length;
                let totalRev = orders.reduce((sum, order) => sum + (order.totalAmount || 0), 0);
                document.getElementById('dash-revenue').innerText = "₹" + totalRev;

                const container = document.getElementById('orders-list');
                if (orders.length === 0) { container.innerHTML = "<p style='color:#777;'>No orders have been placed yet.</p>"; return; }
                
                container.innerHTML = orders.map(o => `
                    <div class="order-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                            <strong style="font-size: 16px; color: #2c3e50;">Order ID: #${o._id.substring(o._id.length-6).toUpperCase()}</strong>
                            <select class="status-select" onchange="updateStatus('${o._id}', this.value)" style="background: ${o.status==='Pending'?'#fff3cd':o.status==='Packed'?'#cce5ff':'#d4edda'}; color: ${o.status==='Pending'?'#856404':o.status==='Packed'?'#004085':'#155724'}">
                                <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                                <option value="Packed" ${o.status==='Packed'?'selected':''}>Packed</option>
                                <option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option>
                            </select>
                        </div>
                        <p style="margin:5px 0;"><strong>Customer:</strong> ${o.customerName} | 📞 ${o.customerPhone}</p>
                        <p style="margin:5px 0;"><strong>Address:</strong> ${o.customerAddress}</p>
                        <div style="background:#fff; padding:15px; margin-top:15px; border-radius:8px; border: 1px solid #e0e0e0;">
                            ${o.items.map(i => `<div style="padding: 3px 0; color: #555;">• ${i.name} <strong>(${i.qty} ${i.unit})</strong></div>`).join('')}
                            <div style="margin-top:15px; padding-top:10px; border-top: 1px dashed #ccc; font-weight:bold; font-size: 16px; color:#27ae60;">
                                Total Bill: ₹${o.totalAmount} <span style="color:#777; font-size:13px; font-weight:normal;">(Paid via ${o.paymentMode})</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function updateStatus(id, newStatus) {
            await fetch(`/api/admin/orders/${id}/status`, {
                method: 'PATCH', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status: newStatus })
            });
            loadOrders(); 
        }

        async function loadInventory() {
            try {
                const res = await fetch('/api/vegetables');
                inventory = await res.json();
                
                // Update Dashboard Stat!
                document.getElementById('dash-products').innerText = inventory.length;

                renderInventory();
            } catch(e) { console.error(e); }
        }

        function renderInventory() {
            const term = document.getElementById('search-inv').value.toLowerCase();
            const tbody = document.getElementById('inv-tbody');
            tbody.innerHTML = '';
            
            if (inventory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px; color: #777;">Your inventory is empty. Click "Add New Vegetable" to start!</td></tr>`;
                return;
            }

            inventory.forEach(item => {
                if (!item.name.toLowerCase().includes(term)) return;
                let img = item.imageUrl || `https://placehold.co/100x100?text=${item.name}`;
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${img}" class="img-preview"></td>
                        <td style="font-weight:bold; color: #333;">${item.name}</td>
                        <td>${item.category || 'Vegetable'}</td>
                        <td style="font-weight:bold; color: #27ae60;">₹${item.price}</td>
                        <td style="color: #777;">${item.unit}</td>
                        <td><button class="btn-del" onclick="deleteItem('${item._id}')">Delete</button></td>
                    </tr>
                `;
            });
        }

        function openModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; }

        async function saveNewItem(e) {
            e.preventDefault();
            const newItem = {
                name: document.getElementById('newName').value, 
                category: document.getElementById('newCat').value,
                price: document.getElementById('newPrice').value, 
                unit: document.getElementById('newUnit').value,
                imageUrl: document.getElementById('newImg').value, 
                inStock: true
            };
            
            await fetch('/api/vegetables', { 
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(newItem) 
            });
            
            closeModal();
            loadInventory(); 
            alert("🎉 Item Added to Store!");
        }

        async function deleteItem(id) {
            if(!confirm("Are you sure you want to delete this item forever?")) return;
            await fetch(`/api/vegetables/${id}`, { method: 'DELETE' });
            loadInventory(); 
        }

        loadOrders();
        loadInventory();
    </script>
</body>
</html>
